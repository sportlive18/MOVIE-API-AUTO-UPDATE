name: MOVIE API JSON AUTOUPDATE
on:
  schedule:
    - cron: '0 */1 * * *' # Runs every 1 hour
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main
    paths:
      - 'movie.py'
     
     
jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz
          # Or if you have requirements.txt:
          # pip install -r requirements.txt

      - name: Run movie.py
        run: python movie.py




      - name: Commit and Push Changes
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"
          git add movie.json
         

          git commit -m "Auto-update playlists: $(date)" || echo "No changes to commit"
          git push
